# Only the public React build is deployed here; never deploy dist-admin.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
